<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f1">
<title>Werbebericht · ShowCube</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6;
  --ink: #14181a; --muted: #5c6561; --faint: #8a918d; --line: #e2dfd6;
  --accent: #0b7a67; --accent-soft: #dcf0ea; --accent-text: #0a6b5a; --warn: #a65f00; --warn-soft: #fbeed5;
  --shadow-1: 0 1px 2px rgba(20,24,26,.06), 0 1px 1px rgba(20,24,26,.04);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110; --surface: #151a19; --surface-2: #1c2322;
    --ink: #e9efed; --muted: #9aa7a3; --faint: #6f7b78; --line: #252e2c;
    --accent: #46c9b0; --accent-soft: #11302a; --accent-text: #6fdcc6; --warn: #f0b25a; --warn-soft: #33270f;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1110; --surface: #151a19; --surface-2: #1c2322;
  --ink: #e9efed; --muted: #9aa7a3; --faint: #6f7b78; --line: #252e2c;
  --accent: #46c9b0; --accent-soft: #11302a; --accent-text: #6fdcc6; --warn: #f0b25a; --warn-soft: #33270f;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, p { margin: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 48px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 9px; font: 800 17px var(--font-display); }
.cube { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: inset -5px -5px 0 rgba(0,0,0,.18); }
.brand span:last-child { margin-left: auto; font: 600 13px var(--font-body); color: var(--muted); }
h1 { font: 800 clamp(28px, 6vw, 40px)/1.08 var(--font-display); letter-spacing: -.02em; }
.sub { color: var(--muted); margin-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-1); padding: 18px; }
.top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: center; }
.top img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: #000; border: 6px solid #111; box-sizing: border-box; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stats .card { padding: 14px 16px; }
.stats span { font-size: 13px; color: var(--muted); display: block; }
.stats b { font: 800 28px/1.15 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
h2 { font: 700 18px/1.2 var(--font-display); margin-bottom: 12px; }
.chart { position: relative; }
.chart svg { width: 100%; height: 220px; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); }
.chart .axis text { fill: var(--muted); font: 12px var(--font-body); }
.chart .bar { fill: var(--accent); }
.chart rect.hit { fill: transparent; cursor: default; }
.chart g.on .bar { opacity: .7; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
.tip[hidden] { display: none; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
td.n, th.n { text-align: right; }
details summary { cursor: pointer; color: var(--accent-text); font-weight: 600; font-size: 14px; margin-top: 12px; }
.note { font-size: 13.5px; color: var(--muted); }
.demo { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 500; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px var(--font-body); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
footer { text-align: center; font-size: 13.5px; color: var(--muted); margin-top: 8px; }
footer a { color: var(--accent-text); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 680px) { .top { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script type="module" src="./main.ts"></script>
</body>
</html>
