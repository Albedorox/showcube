<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f1">
<title>ShowCube Vorlagen-Designer</title>
<script>try { var t = localStorage.getItem('showcube-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6; --stage: #e4e1d8;
  --ink: #14181a; --muted: #5c6561; --faint: #8a918d; --line: #e2dfd6; --line-strong: #cfcbc0;
  --accent: #0b7a67; --accent-hover: #096555; --accent-ink: #ffffff; --accent-soft: #dcf0ea; --accent-text: #0a6b5a;
  --ok: #17794d; --warn: #a65f00; --warn-soft: #fbeed5; --bad: #b3261e;
  --sel: #2f6bff;
  --shadow-1: 0 1px 2px rgba(20,24,26,.06), 0 1px 1px rgba(20,24,26,.04);
  --shadow-2: 0 10px 30px -12px rgba(20,24,26,.22), 0 2px 6px rgba(20,24,26,.06);
  --r: 14px;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d1110; --surface: #151a19; --surface-2: #1c2322; --stage: #0a0d0c;
  --ink: #e9efed; --muted: #9aa7a3; --faint: #6f7b78; --line: #252e2c; --line-strong: #36413e;
  --accent: #46c9b0; --accent-hover: #63d8c1; --accent-ink: #052019; --accent-soft: #11302a; --accent-text: #6fdcc6;
  --ok: #4fca86; --warn: #f0b25a; --warn-soft: #33270f; --bad: #f1776c; --sel: #7aa2ff;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 10px 30px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110; --surface: #151a19; --surface-2: #1c2322; --stage: #0a0d0c;
    --ink: #e9efed; --muted: #9aa7a3; --faint: #6f7b78; --line: #252e2c; --line-strong: #36413e;
    --accent: #46c9b0; --accent-hover: #63d8c1; --accent-ink: #052019; --accent-soft: #11302a; --accent-text: #6fdcc6;
    --ok: #4fca86; --warn: #f0b25a; --warn-soft: #33270f; --bad: #f1776c; --sel: #7aa2ff;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 10px 30px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
h1 { font: 800 19px/1.1 var(--font-display); letter-spacing: -.01em; }
h2 { font: 700 17px/1.2 var(--font-display); }
h3 { font: 700 11.5px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.small { font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 13.5px var(--font-body); white-space: nowrap; text-decoration: none; position: relative; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { height: 30px; padding: 0 9px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.partner { background: var(--warn-soft); color: var(--warn); }
.badge.ok { background: var(--accent-soft); color: var(--accent-text); }
label, .label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=url], input[type=number], select, textarea { width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); padding: 0 10px; }
textarea { height: auto; padding: 8px 10px; resize: vertical; }
input[type=color] { width: 40px; height: 36px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); flex: none; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink); margin: 0; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* ---------- Kopf ---------- */
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo .cube { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 15px var(--font-display); }
.kunde { display: flex; align-items: center; gap: 6px; }
.kunde select { width: auto; min-width: 170px; max-width: 220px; font-weight: 600; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 11px; }
.tabs button { border: 0; background: transparent; height: 30px; padding: 0 14px; border-radius: 8px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.grow { flex: 1; }
.note { margin: 12px 18px 0; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Marke ---------- */
.marke { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; padding: 18px; align-items: start; }
.form { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 74px; max-height: calc(100dvh - 90px); overflow: auto; padding: 2px 4px 20px 2px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-1); }
.logobox { display: flex; gap: 12px; align-items: center; }
.logobox .pv { width: 84px; height: 56px; border-radius: 10px; border: 1px dashed var(--line-strong); display: grid; place-items: center; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 50% / 14px 14px; overflow: hidden; flex: none; }
.logobox .pv img { max-width: 100%; max-height: 100%; }
.farben { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.farbe { display: flex; gap: 8px; align-items: center; }
.farbe > div { min-width: 0; }
.farbe input[type=color] { cursor: pointer; }
.farbe input[type=text] { font-family: ui-monospace, monospace; font-size: 12.5px; height: 30px; }
.kontrast { font-size: 12px; display: flex; gap: 6px; align-items: center; }
.kontrast i { font-style: normal; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
.kontrast .gut { background: var(--accent-soft); color: var(--accent-text); } .kontrast .mau { background: var(--warn-soft); color: var(--warn); }
.paletten { display: flex; gap: 6px; flex-wrap: wrap; }
.paletten button { display: flex; padding: 3px; gap: 0; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.paletten button:hover { border-color: var(--accent); }
.paletten i { width: 13px; height: 22px; display: block; } .paletten i:first-child { border-radius: 5px 0 0 5px; } .paletten i:last-child { border-radius: 0 5px 5px 0; }
.fontsel { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.vorschau-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.gal.hoch { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.slide { display: flex; flex-direction: column; gap: 6px; }
.slide canvas { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; background: #000; display: block; box-shadow: var(--shadow-2); }
.gal.hoch .slide canvas { aspect-ratio: 9 / 16; }
.slide span { font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* ---------- Vorlagen-Editor ---------- */
.editor { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 16px; padding: 16px 18px; align-items: start; }
.liste { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 74px; }
.liste .gruppe { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.liste .gkopf { display: flex; flex-direction: column; gap: 2px; }
.liste .gkopf .small { line-height: 1.35; }
.liste .reihe { display: flex; flex-direction: column; gap: 10px; }
.vitem { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 7px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.vitem[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.vitem canvas { width: 100%; aspect-ratio: 16 / 9; border-radius: 7px; display: block; background: #000; }
.vitem b { font-size: 13px; padding: 0 3px; }
.starter { display: flex; flex-direction: column; gap: 6px; }
.starter button { all: unset; box-sizing: border-box; cursor: pointer; border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.starter button:hover { border-color: var(--accent); background: var(--surface-2); }
.starter button b { font-size: 13px; } .starter button span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.mitte { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.werkzeuge { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.werkzeuge .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.buehne { background: var(--stage); border-radius: 14px; padding: 22px; display: grid; place-items: center; min-height: 300px; }
.rahmen { position: relative; width: 100%; max-width: 980px; aspect-ratio: 16 / 9; box-shadow: 0 20px 50px -20px rgba(0,0,0,.5); user-select: none; touch-action: none; }
.rahmen.hoch { aspect-ratio: 9 / 16; width: auto; height: min(70dvh, 760px); }
.rahmen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sel { position: absolute; border: 1.5px solid var(--sel); pointer-events: none; }
.sel.frei::after { content: attr(data-frei); position: absolute; left: -1.5px; top: -22px; background: var(--sel); color: #fff; font: 700 11px var(--font-body); padding: 2px 7px; border-radius: 6px 6px 6px 0; white-space: nowrap; }
.sel i { position: absolute; width: 11px; height: 11px; background: #fff; border: 1.5px solid var(--sel); border-radius: 3px; pointer-events: auto; }
.sel i[data-h="nw"] { left: -6px; top: -6px; cursor: nwse-resize; } .sel i[data-h="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
.sel i[data-h="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; } .sel i[data-h="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
.hilfs { position: absolute; background: #ff3d8b; pointer-events: none; }
.hover { position: absolute; border: 1px dashed var(--sel); pointer-events: none; opacity: .7; }
.zeit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.zeit { --griff: 22px; --label: 130px; }
.zeit .zr { display: grid; grid-template-columns: var(--griff) var(--label) 1fr; gap: 10px; align-items: center; font-size: 12.5px; cursor: pointer; border-radius: 6px; padding: 1px 4px; }
.zeit .zr[aria-current="true"] { background: var(--surface-2); font-weight: 700; }
.zeit .zr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zeit .bahn { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.zeit .bahn { height: 14px; }
.zeit .bahn b { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; opacity: .85; cursor: grab; touch-action: none; box-shadow: inset 4px 0 0 rgba(0,0,0,.18), inset -4px 0 0 rgba(0,0,0,.18); }
.zeit .bahn b.endlos { box-shadow: inset 4px 0 0 rgba(0,0,0,.18); background: repeating-linear-gradient(90deg, var(--accent) 0 10px, color-mix(in srgb, var(--accent) 70%, transparent) 10px 20px); }
.zeit .bahn b:hover, .zeit .zr[aria-current="true"] .bahn b { opacity: 1; }
.zeit .bahn b:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.zeit .bahn b.zieht { cursor: grabbing; opacity: 1; z-index: 2; }
.zeit .bahn b.zieht::after { content: attr(data-zeit); position: absolute; left: 50%; bottom: calc(100% + 5px); transform: translateX(-50%); background: var(--ink); color: var(--surface); font: 700 11px var(--font-body); padding: 2px 7px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
.zeit .lineal { cursor: default; }
.zeit .zr[data-ebene] { position: relative; transition: transform .15s; }
.zeit .zr.zieht { transition: none; z-index: 3; background: var(--surface); box-shadow: 0 6px 18px -6px rgba(0,0,0,.35); }
.zeit.sortiert, .zeit.sortiert * { cursor: grabbing !important; user-select: none; }
.zeit .zr span em { font-style: normal; font-weight: 700; color: var(--faint); margin-right: 6px; font-variant-numeric: tabular-nums; }
.zeit .griff { width: var(--griff); height: 22px; padding: 0; border: 0; background: none; color: var(--faint); border-radius: 5px; cursor: grab; touch-action: none; display: grid; place-items: center; }
.zeit .griff svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.zeit .griff:hover, .zeit .zr.zieht .griff { color: var(--ink); background: var(--surface-2); }
.zeit .griff:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.zeit .bahn.still { overflow: hidden; background: repeating-linear-gradient(90deg, var(--surface-2) 0 6px, transparent 6px 10px); }
.zeit .bahn.still i { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font: 600 10.5px var(--font-body); font-style: normal; color: var(--faint); white-space: nowrap; }
@media (max-width: 800px) { .zeit { --label: 104px; } }
@media (pointer: coarse) { .zeit { --griff: 34px; } .zeit .griff { height: 34px; } .zeit .zr { min-height: 36px; } }
.zeit .skala { position: relative; height: 14px; border-bottom: 1px solid var(--line); }
.zeit .skala i { position: absolute; bottom: 0; font: 600 10.5px var(--font-body); font-style: normal; color: var(--faint); padding-left: 3px; border-left: 1px solid var(--line); height: 10px; line-height: 10px; white-space: nowrap; }
.zeit .kopf { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #ff3d8b; }
.eig { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 74px; max-height: calc(100dvh - 90px); overflow: auto; padding-bottom: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.grid4 input { padding: 0 6px; }
.rollen { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.rollen button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(0,0,0,.15); padding: 0; }
.rollen button[aria-pressed="true"] { outline: 2px solid var(--sel); outline-offset: 2px; }
.rollen button.keine { background: linear-gradient(to top right, transparent calc(50% - 1px), var(--bad) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)), var(--surface); border-color: var(--line-strong); }
.rollen .eigen { display: inline-flex; align-items: center; gap: 6px; height: 30px; margin: 0 0 0 4px; padding: 0 9px 0 3px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.rollen .eigen:hover { background: var(--surface-2); }
.rollen .eigen[aria-pressed="true"] { outline: 2px solid var(--sel); outline-offset: 2px; }
.rollen .eigen input[type=color] { width: 22px; height: 22px; padding: 0; border: 1px solid rgba(0,0,0,.15); border-radius: 6px; cursor: pointer; }
.rollen .eigen input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } .rollen .eigen input[type=color]::-webkit-color-swatch { border: 0; border-radius: 5px; }
.label em, label em { font-style: normal; font-weight: 500; color: var(--faint); }
.lage { display: flex; flex-direction: column; gap: 10px; }
.pfeld { position: relative; display: flex; align-items: center; margin: 0; height: 36px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); padding-left: 9px; cursor: text; }
.pfeld:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pfeld b { font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
.pfeld input[type=number] { border: 0; height: 34px; background: transparent; padding: 0 2px 0 7px; min-width: 0; text-align: right; outline: none; }
.pfeld i { font-style: normal; font-size: 12px; color: var(--faint); padding-right: 9px; flex: none; }
.sel.mit { box-shadow: 0 0 0 1px rgba(255,255,255,.55); }
.gruppe-sel { position: absolute; border: 1.5px dashed var(--sel); pointer-events: none; margin: -5px; padding: 5px; box-sizing: content-box; }
.gruppe-sel::after { content: attr(data-anzahl); position: absolute; left: -1.5px; top: -22px; background: var(--sel); color: #fff; font: 700 11px var(--font-body); padding: 2px 7px; border-radius: 6px 6px 6px 0; white-space: nowrap; }
.lasso { position: absolute; border: 1px solid var(--sel); background: color-mix(in srgb, var(--sel) 12%, transparent); pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--sel); }
.seg { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
.seg button { flex: 1; border: 0; background: transparent; height: 26px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; padding: 0 8px; }
.btn.voll { width: 100%; position: relative; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.frei-box { border: 1.5px solid var(--sel); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--sel) 6%, var(--surface)); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow-2); z-index: 50; transition: opacity .3s, transform .3s; max-width: calc(100vw - 32px); }
.toast.gone { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.info { max-width: 980px; margin: 18px auto; padding: 0 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.schritte { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.schritte .box b { font: 700 15px var(--font-display); }
.schritte .nr { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
.rechte { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rechte th, .rechte td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.rechte td:not(:first-child), .rechte th:not(:first-child) { text-align: center; width: 120px; }

/* ---------- Vorlage aus Bild (Pro) ---------- */
.badge.pro { background: linear-gradient(135deg, #6d4aff, #c13cff); color: #fff; font-size: 10.5px; letter-spacing: .04em; padding: 1px 7px; text-transform: uppercase; vertical-align: 1px; }
.starter button.ausbild { border-style: solid; border-color: color-mix(in srgb, #8b5cf6 55%, var(--line-strong)); background: color-mix(in srgb, #8b5cf6 7%, var(--surface)); }
.starter button.ausbild:hover { border-color: #8b5cf6; }
.dlg { width: min(1080px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-2); overflow: auto; }
.dlg .btn:disabled { opacity: .45; cursor: not-allowed; }
.dlg::backdrop { background: rgba(10, 14, 13, .55); }
.dlg-kopf, .dlg-fuss { display: flex; align-items: center; gap: 8px; padding: 14px 18px; flex-wrap: wrap; }
.dlg-kopf { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dlg-fuss { border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.ab-start, .ab-inhalt { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.ab-zone { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 230px; padding: 24px; margin: 0; border: 2px dashed var(--line-strong); border-radius: 14px; text-align: center; color: var(--ink); cursor: pointer; background: var(--surface-2); }
.ab-zone svg.i { width: 30px; height: 30px; color: var(--accent); }
.ab-zone b { font: 700 16px var(--font-display); }
.ab-zone .small { max-width: 460px; }
.ab-zone.drueber, .ab-zone:hover { border-color: var(--accent); background: var(--accent-soft); }
.ab-zone input[type=file], .dlg-fuss .btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.ab-vergleich { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.ab-vergleich figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ab-vergleich figcaption { font: 700 11.5px var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ab-bild { width: 100%; max-height: 52dvh; object-fit: contain; border-radius: 10px; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 50% / 16px 16px; display: block; box-shadow: var(--shadow-1); }
canvas.ab-bild { background: #000; }
.ab-platz { min-height: 220px; border: 1.5px dashed var(--line-strong); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; text-align: center; color: var(--muted); font-weight: 600; }
.ab-platz.mit-fehler { border-color: color-mix(in srgb, var(--bad) 45%, var(--line-strong)); }
.ab-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: #8b5cf6; animation: ab-dreh .9s linear infinite; }
@keyframes ab-dreh { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ab-spinner { animation-duration: 3s; } }
.ab-optionen { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ab-ergebnis { font-size: 13.5px; }
.ab-fehler { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); font-weight: 600; }
.ab-hinweis { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; font-weight: 600; }
.ab-hinweis a, .ab-fehler a { color: inherit; }
@media (max-width: 800px) { .ab-vergleich { grid-template-columns: 1fr; } .dlg-kopf, .dlg-fuss, .ab-start, .ab-inhalt { padding: 12px 14px; } }
@media (max-width: 1560px) { #ladenBtn, #speichern { width: 32px; padding: 0; font-size: 0; gap: 0; } }
@media (max-width: 1100px) {
  .editor { grid-template-columns: minmax(0, 1fr) 280px; }
  .liste { grid-column: 1 / -1; position: static; gap: 14px; }
  .liste .gruppe { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; }
  .liste .reihe { flex-direction: row; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; margin: 0 -12px; padding-inline: 12px; scroll-padding-inline: 12px; }
  .liste .reihe > * { scroll-snap-align: start; }
  .liste .vitem { width: 170px; flex: none; } .liste .starter button { width: 180px; flex: none; }
}
@media (max-width: 800px) {
  header.top { padding: 10px 16px; }
  .marke, .editor { grid-template-columns: minmax(0, 1fr); padding: 14px 16px; }
  .form, .eig { position: static; max-height: none; overflow: visible; }
  .kunde select { min-width: 0; }
  .buehne { padding: 10px; }
  .rahmen.hoch { height: 70dvh; }
}
</style>
